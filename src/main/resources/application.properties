spring.application.name=TongChoo-BE
spring.profiles.active=local
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.asdf.tongchoobe=DEBUG

app.jwt.secret=${JWT_SECRET:CHANGE_ME_LOCAL_ONLY_SECRET_KEY_AT_LEAST_32_BYTES}
app.jwt.access-token-expiration=7200000

app.cors.allowed-origins=http://localhost:5173

app.llm.api-key=${CEREBRAS_API_KEY:}
app.llm.base-url=https://api.cerebras.ai/v1
app.llm.model=llama-3.3-70b
app.llm.timeout=8000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
