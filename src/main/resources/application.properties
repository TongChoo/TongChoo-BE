spring.application.name=TongChoo-BE
spring.profiles.active=local
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.asdf.tongchoobe=DEBUG

app.jwt.secret=${JWT_SECRET:CHANGE_ME_LOCAL_ONLY_SECRET_KEY_AT_LEAST_32_BYTES}
app.jwt.access-token-expiration=7200000

app.cors.allowed-origins=http://localhost:5173

tongchoo.ai.base-url=${TONGCHOO_AI_BASE_URL:http://localhost:8001}
tongchoo.ai.internal-token=${TONGCHOO_AI_INTERNAL_TOKEN:}
tongchoo.ai.connect-timeout-ms=1000
tongchoo.ai.read-timeout-ms=20000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
